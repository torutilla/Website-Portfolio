<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christian Torres</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/" type="image/x-icon">
</head>
<body>
    <canvas id="background-canvas"></canvas>
    <div id="game">
        <canvas id="game-canvas"></canvas>
    </div>
    <div class="ui" id="main-ui">
        <div id="title-box"></div>
        <div class="ui" id="mobile-hud">
            <div id="controller">
                <div class="vertical">
                    <button class="directional-button" data-direction="W">▲</button>
                    <button class="directional-button" data-direction="S">▼</button>
                </div>
                <div>
                    <button class="directional-button" data-direction="A">◄</button>
                    <button class="directional-button" data-direction="D">►</button>
                </div>
            </div>
        </div>
        <div id="interaction-box">
        </div>
    </div>
    <div class="ui" id="modal">
        <div id="modal-container"></div>
    </div>
    
    <script src="script.js" type="module"></script>
</body>
</html>
